[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "clean-air-agent"
version = "0.1.0"
description = "Clean Air Investigator - Secure AI for Sustainability"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "google-adk>=2.9.2",
    "google-genai>=1.0.0",
    "streamlit>=1.35.0",
    "plotly>=5.20.0",
    "pydeck>=0.9.0",
    "pandas>=2.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.0",
    "nbformat>=4.2.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["clean_air_agent*"]
